<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>KMPwright header</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 2400px; height: 1260px; overflow: hidden; }
  body {
    font-family: "Geist", system-ui, sans-serif; color: #1b1530; position: relative;
    background:
      radial-gradient(1400px 700px at 50% 100%, rgba(127, 82, 255, 0.22), transparent 70%),
      radial-gradient(900px 500px at 50% 0%, rgba(200, 17, 226, 0.06), transparent 70%),
      #fbf9ff;
  }

  .top { position: absolute; top: 74px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
  .brand { display: flex; align-items: center; gap: 26px; }
  .brand img { width: 108px; height: 108px; border-radius: 26px; box-shadow: 0 10px 28px rgba(80, 40, 160, 0.18), 0 0 0 1.5px rgba(127, 82, 255, 0.12); }
  .word { font-size: 104px; line-height: 1; letter-spacing: -0.045em; }
  .word b { font-weight: 700; }
  .word span { font-weight: 380; }
  .tag { margin-top: 30px; font-size: 44px; font-weight: 450; letter-spacing: -0.02em; color: #6b6382; }
  .tag b { font-weight: 600; color: #1b1530; }

  /* Frames follow each screen's real ratio: Galaxy S25 1080 x 2340, iPad Pro 11" 2420 x 1668, iPhone 18 Pro 1206 x 2622. */
  .device {
    position: absolute; background: linear-gradient(160deg, #ffffff, #ece8f4);
    box-shadow: 0 0 0 1.5px rgba(60, 30, 120, 0.12), 0 40px 100px rgba(60, 30, 120, 0.20), 0 8px 24px rgba(60, 30, 120, 0.08);
  }
  .device img { display: block; box-shadow: 0 0 0 1px rgba(60, 30, 120, 0.10); }
  .android { left: 190px; top: 380px; padding: 9px; border-radius: 50px; }
  .android img { width: 430px; height: 932px; border-radius: 41px; }
  .ipad { left: 680px; top: 360px; padding: 12px; border-radius: 46px; }
  .ipad img { width: 1040px; height: 717px; border-radius: 34px; }
  .iphone { left: 1770px; top: 380px; padding: 9px; border-radius: 70px; }
  .iphone img { width: 430px; height: 935px; border-radius: 61px; }
</style>
<body>
  <div class="top">
    <div class="brand">
      <img src="../../../brand/icon.png" alt="">
      <div class="word"><b>KMP</b><span>wright</span></div>
    </div>
    <div class="tag">One Kotlin workflow. <b>The same result on Android, iOS and the JVM.</b></div>
  </div>

  <div class="device android"><img src="android.png" alt=""></div>
  <div class="device ipad"><img src="ipad.png" alt=""></div>
  <div class="device iphone"><img src="ios.png" alt=""></div>
</body>
</html>
