name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Install locked website dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Check and build website
        run: |
          pnpm types:check
          pnpm lint
          pnpm build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4.0.4
      - name: Install verification and browser contract tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep ffmpeg libnss3-tools
      - name: Verify repository metadata and documentation
        run: |
          ./scripts/verify-agent-browser-compatibility.sh
          ./scripts/verify-documentation.sh
      - name: Build Android
        run: |
          export KMPWRIGHT_TEST_CHROME="$(command -v google-chrome || command -v chromium)"
          test -n "$KMPWRIGHT_TEST_CHROME"
          ./scripts/build-react-fixture.sh
          export KMPWRIGHT_TEST_REACT_BUNDLE="$PWD/.upstream/react-fixture/app.bundle.js"
          ./scripts/ci-build.sh
      - name: Upload JVM failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-diagnostics
          path: |
            kmpwright-core/build/reports/tests/jvmTest/
            kmpwright-core/build/test-results/jvmTest/

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Build iOS
        run: ./gradlew :kmpwright-core:linkReleaseFrameworkIosSim :kmpwright-example-shared:linkReleaseFrameworkIosSim
      - name: Run iOS simulator backend contracts
        run: ./gradlew :kmpwright-core:iosSimTest --no-daemon
      - name: Run iOS tests in an app host (WKWebView document contracts)
        run: ./scripts/run-ios-webkit-tests.sh
      - name: Verify XCFramework and Swift consumer
        run: ./scripts/verify-ios-xcframework.sh

  release-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4.0.4
      - name: Verify local publications and independent consumers
        run: ./scripts/verify-publication.sh

  android-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4.0.4
      - name: Build instrumentation APKs before booting the emulator
        run: ./gradlew :kmpwright-test:assembleDebug :kmpwright-test:assembleDebugAndroidTest --no-daemon
      - name: Enable emulator hardware acceleration
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          disable-linux-hw-accel: false
          script: ./scripts/run-android-tests-ci.sh emulator-5554
      - name: Upload instrumentation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-diagnostics
          path: |
            kmpwright-test/build/reports/androidTests/
            kmpwright-test/build/outputs/androidTest-results/
            android-instrumentation-logcat.txt
            android-instrumentation-failure.png
