<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>KMPwright Playground</title>
  <style>
    :root { color-scheme: light dark; --accent:#5b4fc4; --accent-2:#00696b; --bg:#fcf8ff; --card:#ffffff;
            --text:#1c1b22; --muted:#605d68; --line:#e5e0ef; --ok:#0b7a43; --bad:#ba1a1a; }
    @media (prefers-color-scheme: dark) {
      :root { --accent:#c8bfff; --accent-2:#80d4d5; --bg:#14131a; --card:#211f26; --text:#e5e1eb;
              --muted:#c9c4d0; --line:#36343c; --ok:#7ddba2; --bad:#ffb4ab; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font: 15px/1.5 system-ui, -apple-system, Roboto, sans-serif; background:var(--bg); color:var(--text); }
    main { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
    h1 { font-size: 26px; line-height: 1.15; margin: 8px 0 4px; letter-spacing: -0.02em; }
    h2 { font-size: 16px; margin: 0 0 10px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin: 12px 0; }
    label { display:block; font-weight: 600; font-size: 13px; margin: 10px 0 5px; }
    input[type=text], input[type=email], input[type=search], select {
      width:100%; font: inherit; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line);
      background: transparent; color: inherit; }
    input:focus, select:focus { outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent); border-color: var(--accent); }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer;
             background: var(--accent); color: var(--bg); transition: transform .12s ease, border-radius .2s ease; }
    button:active { transform: scale(.96); border-radius: 12px; }
    button.secondary { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
    .row { display:flex; gap: 8px; align-items:center; flex-wrap: wrap; }
    .check { display:flex; gap:10px; align-items:center; font-weight: 500; margin-top: 12px; }
    .check input { width: 18px; height: 18px; accent-color: var(--accent); }
    .pill { display:inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
            background: rgba(255,255,255,.18); color: white; }
    #signup-status { margin: 12px 0 0; font-weight: 600; color: var(--ok); min-height: 1.5em; }
    ul.results { list-style: none; padding: 0; margin: 10px 0 0; }
    ul.results li { padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); margin-bottom: 6px; }
    ul.results:empty { display: none; }
    .hero { border-radius: 24px; padding: 22px 20px; color: white; margin-bottom: 14px;
            background: linear-gradient(135deg, #5b4fc4 0%, #8a4fa9 55%, #00696b 100%); }
    .hero p { opacity: .9; margin: 4px 0 0; }
    output { font-size: 26px; font-weight: 700; min-width: 44px; text-align: center; }
  </style>
</head>
<body>
<main>
  <div class="hero">
    <span class="pill">Playground</span>
    <h1>Hello, agent 👋</h1>
    <p>Snapshot this page, then act on the refs.</p>
  </div>

  <section class="card" aria-labelledby="signup-title">
    <h2 id="signup-title">Create an account</h2>
    <form id="signup">
      <label for="full-name">Full name</label>
      <input id="full-name" type="text" autocomplete="off" placeholder="Ada Lovelace">
      <label for="plan">Plan</label>
      <select id="plan">
        <option value="hobby">Hobby — free</option>
        <option value="pro">Pro — $12/mo</option>
        <option value="team">Team — $49/mo</option>
      </select>
      <label class="check"><input id="terms" type="checkbox"> I agree to the terms</label>
      <div class="row" style="margin-top:14px">
        <button type="submit">Create account</button>
        <button type="reset" class="secondary">Reset</button>
      </div>
      <p id="signup-status" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section class="card" aria-labelledby="counter-title">
    <h2 id="counter-title">Counter</h2>
    <div class="row">
      <button id="decrement" class="secondary" aria-label="Decrement">−</button>
      <output id="count" aria-label="Count">0</output>
      <button id="increment" aria-label="Increment">+</button>
    </div>
  </section>

  <section class="card" aria-labelledby="search-title">
    <h2 id="search-title">Search the docs</h2>
    <form id="search" class="row" role="search">
      <input id="query" type="search" aria-label="Search" placeholder="Try “locator”" style="flex:1">
      <button type="submit">Search</button>
    </form>
    <ul class="results" id="results" aria-label="Results"></ul>
  </section>
</main>
<script>
  const $ = id => document.getElementById(id);
  const docs = ['Locator API', 'Page.goto', 'Accessibility snapshot', 'Network routes', 'Screenshots', 'Keyboard input'];
  $('search').addEventListener('submit', e => {
    e.preventDefault();
    const q = $('query').value.trim().toLowerCase(), list = $('results');
    list.innerHTML = '';
    docs.filter(d => d.toLowerCase().includes(q)).forEach(d => {
      const li = document.createElement('li'); li.textContent = d; list.appendChild(li);
    });
    if (!list.children.length) list.innerHTML = '<li>No results</li>';
    console.log('Search "' + q + '": ' + list.querySelectorAll('li').length + ' result(s)');
  });
  $('signup').addEventListener('submit', e => {
    e.preventDefault();
    const out = $('signup-status'), plan = $('plan');
    if (!$('terms').checked) { out.style.color = 'var(--bad)'; out.textContent = 'Please accept the terms.'; console.warn('Sign-up blocked: terms not accepted'); return; }
    out.style.color = '';
    out.textContent = 'Welcome, ' + ($('full-name').value || 'friend') + '! You picked ' +
      plan.options[plan.selectedIndex].text.split(' —')[0] + '.';
    console.log('Signed up:', $('full-name').value || 'friend', '·', plan.value);
  });
  $('signup').addEventListener('reset', () => { $('signup-status').textContent = ''; });
  let n = 0;
  $('increment').onclick = () => { $('count').textContent = ++n; console.log('Count:', n); };
  $('decrement').onclick = () => { $('count').textContent = --n; console.log('Count:', n); };
</script>
</body>
</html>
